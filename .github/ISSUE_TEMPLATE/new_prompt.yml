name: 🎨 New Prompt Suggestion
description: Suggest a new GPT Image 2 prompt for the collection
title: "[Prompt]: "
labels: ["prompt-suggestion"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for suggesting a prompt! If you can open a PR yourself with the image and entry, that's even better — see [CONTRIBUTING.md](../blob/main/CONTRIBUTING.md).

  - type: input
    id: title
    attributes:
      label: Prompt Title
      description: A short descriptive name for the prompt
      placeholder: e.g. "Cyberpunk Neon Portrait"
    validations:
      required: true

  - type: dropdown
    id: category
    attributes:
      label: Category
      options:
        - Portraits
        - Text Rendering
        - Commercial Illustration
        - Product & Mockups
        - Logos & Branding
        - Scenes & Environments
        - Other (specify below)
    validations:
      required: true

  - type: textarea
    id: prompt
    attributes:
      label: Full Prompt
      description: The exact prompt text you sent to GPT Image 2
      render: text
    validations:
      required: true

  - type: textarea
    id: why
    attributes:
      label: Why It Works
      description: |
        Explain the prompting *technique* — what about the structure makes this work?
        See examples in the [main README](../blob/main/README.md).
    validations:
      required: true

  - type: textarea
    id: variations
    attributes:
      label: Variations (optional)
      description: One or two concrete swaps a reader could make
    validations:
      required: false

  - type: textarea
    id: image
    attributes:
      label: Example Image
      description: Drag and drop an example output image generated by GPT Image 2
    validations:
      required: true

  - type: checkboxes
    id: checks
    attributes:
      label: Checklist
      options:
        - label: The image was generated by GPT Image 2 (not another model)
          required: true
        - label: The prompt does not generate copyrighted characters or real public figures
          required: true
        - label: I'm okay with this contribution being licensed under CC BY 4.0
          required: true
